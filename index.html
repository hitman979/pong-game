<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111827;
      color: #f9fafb;
      font-family: Arial, sans-serif;
    }

    .game-wrapper {
      text-align: center;
    }

    #scoreboard {
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 0.1em;
      margin-bottom: 12px;
    }

    canvas {
      display: block;
      background: #0f172a;
      border: 4px solid #e5e7eb;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div id="scoreboard">
      <span id="playerScore">0</span> : <span id="computerScore">0</span>
    </div>
    <canvas id="game" width="900" height="500"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const playerScoreEl = document.getElementById("playerScore");
    const computerScoreEl = document.getElementById("computerScore");

    const paddleWidth = 18;
    const paddleHeight = 110;
    const paddleSpeed = 8;
    const ballRadius = 10;

    const player = {
      x: 30,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      score: 0,
      speed: paddleSpeed
    };

    const computer = {
      x: canvas.width - 30 - paddleWidth,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      score: 0,
      speed: 5.2
    };

    let ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: ballRadius,
      vx: 5 + Math.random() * 1.5,
      vy: 3 + Math.random() * 2,
      speed: 6
    };

    const keys = {
      ArrowUp: false,
      ArrowDown: false
    };

    function resetBall(direction) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      const angle = (Math.random() * Math.PI / 2) - Math.PI / 4;
      const speed = 5.5;

      ball.vx = direction * speed * Math.cos(angle);
      ball.vy = speed * Math.sin(angle);
    }

    function updateScoreboard() {
      playerScoreEl.textContent = player.score;
      computerScoreEl.textContent = computer.score;
    }

    function movePlayer() {
      if (keys.ArrowUp) {
        player.y -= player.speed;
      }
      if (keys.ArrowDown) {
        player.y += player.speed;
      }

      player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));
    }

    function moveComputer() {
      const center = computer.y + computer.height / 2;
      const ballCenter = ball.y;

      if (ballCenter > center) {
        computer.y += computer.speed;
      } else if (ballCenter < center) {
        computer.y -= computer.speed;
      }

      computer.y = Math.max(0, Math.min(canvas.height - computer.height, computer.y));
    }

    function handlePaddleCollision(paddle, isPlayer) {
      const ballLeft = ball.x - ball.radius;
      const ballRight = ball.x + ball.radius;
      const ballTop = ball.y - ball.radius;
      const ballBottom = ball.y + ball.radius;

      const paddleLeft = paddle.x;
      const paddleRight = paddle.x + paddle.width;
      const paddleTop = paddle.y;
      const paddleBottom = paddle.y + paddle.height;

      if (
        ballRight >= paddleLeft &&
        ballLeft <= paddleRight &&
        ballBottom >= paddleTop &&
        ballTop <= paddleBottom
      ) {
        const collisionPoint = (ball.y - (paddle.y + paddle.height / 2)) / (paddle.height / 2);
        const bounceAngle = collisionPoint * (Math.PI / 3);
        const speed = Math.min(13, Math.hypot(ball.vx, ball.vy) + 0.35);

        if (isPlayer) {
          ball.x = paddle.x + paddle.width + ball.radius;
          ball.vx = Math.abs(Math.cos(bounceAngle)) * speed;
        } else {
          ball.x = paddle.x - ball.radius;
          ball.vx = -Math.abs(Math.cos(bounceAngle)) * speed;
        }

        ball.vy = Math.sin(bounceAngle) * speed;
      }
    }

    function updateBall() {
      ball.x += ball.vx;
      ball.y += ball.vy;

      if (ball.y - ball.radius <= 0 || ball.y + ball.radius >= canvas.height) {
        ball.vy *= -1;
        ball.y = Math.max(ball.radius, Math.min(canvas.height - ball.radius, ball.y));
      }

      if (ball.x - ball.radius <= 0) {
        computer.score += 1;
        updateScoreboard();
        resetBall(1);
      }

      if (ball.x + ball.radius >= canvas.width) {
        player.score += 1;
        updateScoreboard();
        resetBall(-1);
      }

      handlePaddleCollision(player, true);
      handlePaddleCollision(computer, false);
    }

    function drawPaddle(paddle) {
      ctx.fillStyle = "#f9fafb";
      ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
    }

    function drawBall() {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = "#fbbf24";
      ctx.fill();
      ctx.closePath();
    }

    function drawCenterLine() {
      ctx.strokeStyle = "rgba(255,255,255,0.35)";
      ctx.setLineDash([12, 12]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawCenterLine();
      drawPaddle(player);
      drawPaddle(computer);
      drawBall();
    }

    function gameLoop() {
      movePlayer();
      moveComputer();
      updateBall();
      draw();
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener("keydown", (event) => {
      if (event.key in keys) {
        keys[event.key] = true;
      }
    });

    document.addEventListener("keyup", (event) => {
      if (event.key in keys) {
        keys[event.key] = false;
      }
    });

    canvas.addEventListener("mousemove", (event) => {
      const rect = canvas.getBoundingClientRect();
      const relativeY = ((event.clientY - rect.top) / (rect.height)) * canvas.height;
      player.y = relativeY - player.height / 2;
      player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));
    });

    updateScoreboard();
    resetBall(Math.random() < 0.5 ? -1 : 1);
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
